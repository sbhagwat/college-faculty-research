name: Refresh faculty research

on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Also retry schools whose last attempt failed"
        type: boolean
        default: true
  schedule:
    - cron: "0 9 * * 1"  # 09:00 UTC every Monday

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run faculty research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RETRY_FLAG=""
          if [ "${{ inputs.retry_failed }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            RETRY_FLAG="--retry-failed"
          fi
          python research_faculty.py --resume $RETRY_FLAG --concurrency 4

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faculty_results.json faculty_results.csv faculty_results.md faculty_results.js report.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh faculty research ($(date -u +%Y-%m-%d))"
            git push
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build site payload
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp -f faculty_results.json faculty_results.csv faculty_results.md faculty_results.js _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

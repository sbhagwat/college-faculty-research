name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - "report.html"
      - "faculty_results.*"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site payload
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp -f faculty_results.json faculty_results.csv faculty_results.md faculty_results.js _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

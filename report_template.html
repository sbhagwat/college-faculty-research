<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faculty Outreach Report</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
    --warn: #f59e0b;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
  }
  header { max-width: 1200px; margin: 0 auto 24px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .meta { color: var(--muted); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; }
  .controls {
    display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border);
  }
  input, select {
    font: inherit; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: white; min-width: 200px;
  }
  input[type=search] { flex: 1; min-width: 260px; }
  .stats { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); }
  .school {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 16px; overflow: hidden;
  }
  .school h2 {
    margin: 0; padding: 14px 18px; font-size: 16px; background: #fafbfc;
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
    align-items: center;
  }
  .school .count { color: var(--muted); font-weight: normal; font-size: 13px; }
  .faculty-list { padding: 4px 0; }
  .faculty {
    padding: 14px 18px; border-bottom: 1px solid #f0f1f3;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 16px;
  }
  .faculty:last-child { border-bottom: none; }
  .faculty .name { font-weight: 600; font-size: 15px; }
  .faculty .name a { color: var(--accent); text-decoration: none; }
  .faculty .name a:hover { text-decoration: underline; }
  .faculty .dept { color: var(--muted); font-size: 13px; }
  .faculty .area { color: #374151; font-size: 13px; }
  .faculty .notable { color: #374151; font-size: 13px; margin-top: 4px; }
  .faculty .contact { text-align: right; font-size: 12px; color: var(--muted); }
  .faculty .contact a { color: var(--accent); text-decoration: none; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-left: 8px;
  }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.err { background: #fee2e2; color: #991b1b; }
  .empty { padding: 18px; color: var(--muted); font-style: italic; }
  .hidden { display: none; }
  .foot { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  .foot code { background: white; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Biology / Biotech Faculty Outreach Report</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div class="controls">
    <input id="q" type="search" placeholder="Search name, department, research area, school…" autofocus>
    <select id="schoolFilter"><option value="">All schools</option></select>
    <select id="sort">
      <option value="school">Sort: by school (original order)</option>
      <option value="name">Sort: by faculty name</option>
      <option value="countDesc">Sort: schools w/ most faculty first</option>
    </select>
    <div class="stats" id="stats"></div>
  </div>
  <div id="content"></div>
  <div class="foot">Data source: <code>faculty_results.js</code> · Re-run <code>research_faculty.py --resume</code> to refresh.</div>
</main>
<script src="faculty_results.js"></script>
<script>
(function(){
  const data = (window.FACULTY_DATA || []);
  const content = document.getElementById("content");
  const q = document.getElementById("q");
  const schoolFilter = document.getElementById("schoolFilter");
  const sort = document.getElementById("sort");
  const meta = document.getElementById("meta");
  const stats = document.getElementById("stats");

  data.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.school; opt.textContent = s.school;
    schoolFilter.appendChild(opt);
  });

  const totalFaculty = data.reduce((n, s) => n + (s.faculty || []).length, 0);
  meta.textContent = `${data.length} schools · ${totalFaculty} faculty`;

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

  function facultyHTML(f) {
    const nameHTML = f.url
      ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`
      : esc(f.name);
    return `
      <div class="faculty">
        <div>
          <div class="name">${nameHTML}</div>
          ${f.department ? `<div class="dept">${esc(f.department)}</div>` : ""}
          ${f.research_area ? `<div class="area">${esc(f.research_area)}</div>` : ""}
          ${f.notable ? `<div class="notable">${esc(f.notable)}</div>` : ""}
        </div>
        <div class="contact">
          ${f.email ? `<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>` : "<span>no email listed</span>"}
        </div>
      </div>`;
  }

  function schoolHTML(s, matches) {
    const faculty = matches;
    const bad = s._error ? `<span class="badge err">error</span>`
              : s._raw   ? `<span class="badge warn">parse failed</span>` : "";
    return `
      <section class="school" data-school="${esc(s.school)}">
        <h2>${esc(s.school)}${bad}<span class="count">${faculty.length} of ${(s.faculty||[]).length}</span></h2>
        <div class="faculty-list">
          ${faculty.length ? faculty.map(facultyHTML).join("")
                           : `<div class="empty">No faculty match the current filter.</div>`}
        </div>
      </section>`;
  }

  function render() {
    const query = q.value.trim().toLowerCase();
    const onlySchool = schoolFilter.value;
    const sortMode = sort.value;

    let schools = data.slice();
    if (onlySchool) schools = schools.filter(s => s.school === onlySchool);

    const processed = schools.map(s => {
      let faculty = (s.faculty || []).slice();
      if (query) {
        faculty = faculty.filter(f => {
          const hay = [f.name, f.department, f.research_area, f.notable, s.school, f.email]
            .filter(Boolean).join(" ").toLowerCase();
          return hay.includes(query);
        });
      }
      if (sortMode === "name") faculty.sort((a,b) => (a.name||"").localeCompare(b.name||""));
      return { s, faculty };
    });

    let visible = processed;
    if (query) visible = visible.filter(p => p.faculty.length > 0);

    if (sortMode === "countDesc") {
      visible = visible.slice().sort((a,b) => b.faculty.length - a.faculty.length);
    }

    content.innerHTML = visible.length
      ? visible.map(p => schoolHTML(p.s, p.faculty)).join("")
      : `<div class="empty" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center">No matches.</div>`;

    const shownFaculty = visible.reduce((n, p) => n + p.faculty.length, 0);
    stats.innerHTML = `Showing <b>${shownFaculty}</b> faculty across <b>${visible.length}</b> schools`;
  }

  q.addEventListener("input", render);
  schoolFilter.addEventListener("change", render);
  sort.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
